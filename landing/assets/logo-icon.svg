<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="1024" height="1024" role="img" aria-label="OpenPhysicalAI Lab" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5ac8fa"/><stop offset="0.55" stop-color="#007aff"/><stop offset="1" stop-color="#5856d6"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.2" r="0.9"><stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="100" height="100" rx="22.5" fill="url(#bg)"/>
  <rect width="100" height="100" rx="22.5" fill="url(#glow)"/>
  <!-- budget gauge ring, open on the right where the gripper reaches out -->
  <path d="M 77.5 33.5 A 29 29 0 1 0 77.5 66.5" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" opacity="0.95"/>
  <!-- two-link arm -->
  <polyline points="37,61 48,41 63,48" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="37" cy="61" r="5" fill="#fff"/>
  <circle cx="48" cy="41" r="4" fill="#fff"/>
  <!-- gripper prongs -->
  <path d="M 63 48 L 71 41.5 M 63 48 L 71 54.5" stroke="#fff" stroke-width="4.6" stroke-linecap="round" fill="none"/>
</svg>
