[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openphysicalai"
version = "0.2.0"
description = "OpenPhysicalAI Lab core: budget-aware, latency-coupled evaluation for Physical AI"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
dependencies = ["mujoco>=3.1", "numpy>=1.24", "psutil>=5.9"]

[project.optional-dependencies]
sim = ["mujoco>=3.1"]
gpu = ["psutil", "nvidia-ml-py"]
dev = ["pytest"]

[project.scripts]
opai = "openphysicalai.cli:main"

[tool.setuptools.packages.find]
include = ["openphysicalai*"]
